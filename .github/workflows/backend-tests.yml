name: Backend Tests (PostgreSQL + Redis)

# SG3-F4-B: PostgreSQL CI integration for the backend test suite.
# SG3-F6-C: Redis integration for upload rate-limiter verification.
# SG3-F6-D: Redis authentication enforcement for upload rate limiter.
#
# The repository previously had no CI provider configured. GitHub is the
# configured remote, so GitHub Actions is the smallest compatible provider.
#
# This job provisions an isolated, disposable PostgreSQL service (a fresh
# container per run) with CI-only credentials and a dedicated test database,
# applies `alembic upgrade head` to the disposable database, and runs the
# complete backend suite under `tests/` -- including the database-backed
# modules `test_scan_claim.py`, `test_artifact_lifecycle.py`, and
# `test_scan_claim_integration.py` (which require PostgreSQL row-level locking
# via `SELECT ... FOR UPDATE NOWAIT` and are therefore never run on SQLite).
#
# A Redis 7 service is also provisioned with authentication so that the upload
# rate limiter's Redis-auth enforcement and fail-closed 503 behavior can be
# verified against a real Redis instance.
#
# No production database or credentials are used: the credentials below are
# throwaway values for the ephemeral service containers. The gitignored local
# `.env` is never read because every required setting is provided by this
# workflow's environment block.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend test suite (PostgreSQL 16)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: neuroscan_ci
          POSTGRES_PASSWORD: neuroscan_ci_password
          POSTGRES_DB: neuroscan_ci
        ports:
          - 5432:5432
        # The job does not start until this health check passes, so PostgreSQL
        # is ready before the migration step runs.
        options: >-
          --health-cmd "pg_isready -U neuroscan_ci -d neuroscan_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        # GitHub Actions service containers do not support `command`; start
        # Redis without authentication, then set a disposable test password
        # via CONFIG SET in a setup step below. The password is never printed
        # in command output thanks to --no-auth-warning.
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 5s

    env:
      # CI-only test credentials for the ephemeral service containers above.
      # These are not production credentials and are never reused elsewhere.
      DATABASE_URL: postgresql+psycopg2://neuroscan_ci:neuroscan_ci_password@localhost:5432/neuroscan_ci
      MINIO_ACCESS_KEY: ci_test_access_key
      MINIO_SECRET_KEY: ci_test_secret_key
      FIREBASE_PROJECT_ID: neuroscan-ci
      CORS_ORIGINS: http://localhost:3000
      # Authenticated Redis URL for CI. The default user "default" authenticates
      # with the password set via --requirepass above.
      REDIS_URL: redis://:redis_ci_test_password_99@localhost:6379/0
      RATE_LIMIT_REDIS_REQUIRE_AUTH: "true"

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          # torch==2.2.0 publishes wheels up to cp312; 3.11 is the safe pin
          # for the frozen scientific stack in requirements.txt.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Wait for PostgreSQL readiness
        run: |
          python - <<'PY'
          import os
          import sys
          import time

          import psycopg2

          dsn = os.environ["DATABASE_URL"].replace(
              "postgresql+psycopg2://", "postgresql://"
          )
          for attempt in range(1, 31):
              try:
                  psycopg2.connect(dsn).close()
                  print("PostgreSQL is ready.")
                  sys.exit(0)
              except psycopg2.OperationalError as exc:
                  print(f"Waiting for PostgreSQL ({attempt}/30): {exc}")
                  time.sleep(2)
          print("PostgreSQL did not become ready in time.", file=sys.stderr)
          sys.exit(1)
          PY

      - name: Wait for Redis readiness
        run: |
          python - <<'PY'
          import os
          import sys
          import time

          import redis

          # Redis starts without authentication; wait for it to accept
          # connections before setting the requirepass password.
          dsn = os.environ["REDIS_URL"].split("@")[-1]
          unauthenticated = "redis://" + dsn if "@" in dsn else dsn
          for attempt in range(1, 31):
              try:
                  redis.Redis.from_url(unauthenticated, socket_connect_timeout=2).ping()
                  print("Redis is ready.")
                  sys.exit(0)
              except redis.RedisError as exc:
                  print(f"Waiting for Redis ({attempt}/30): {exc}")
                  time.sleep(2)
          print("Redis did not become ready in time.", file=sys.stderr)
          sys.exit(1)
          PY

      - name: Configure Redis authentication
        run: |
          # Set a disposable test password on the running Redis instance.
          # CONFIG SET does not print the password; --no-auth-warning suppresses
          # the Redis CLI warning banner for authenticated commands.
          redis-cli CONFIG SET requirepass "${REDIS_PASSWORD}"
          redis-cli -a "${REDIS_PASSWORD}" --no-auth-warning ping
        env:
          REDIS_PASSWORD: redis_ci_test_password_99

      - name: Recreate test database schema
        run: |
          python - <<'PY'
          import os

          import psycopg2

          # The service container is disposable, but recreating the public
          # schema makes the isolation explicit and keeps repeat runs clean.
          dsn = os.environ["DATABASE_URL"].replace(
              "postgresql+psycopg2://", "postgresql://"
          )
          conn = psycopg2.connect(dsn)
          conn.autocommit = True
          with conn.cursor() as cur:
              cur.execute("DROP SCHEMA IF EXISTS public CASCADE; CREATE SCHEMA public;")
          conn.close()
          print("Recreated public schema.")
          PY

      - name: Apply migrations (alembic upgrade head)
        run: alembic upgrade head

      - name: Run complete backend test suite
        run: python -m pytest tests/ -v
